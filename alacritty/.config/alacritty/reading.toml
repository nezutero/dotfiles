[general]
import = [
    "~/.config/alacritty/themes/gruvbox_material_medium_dark.toml"
]
[colors.primary]
background = "#000000"
[font.bold]
family = "Fira Code"
style = "Bold"
[font.bold_italic]
family = "Fira Code"
style = "Bold"
[font.italic]
family = "Fira Code"
style = "Regular"
[font.normal]
family = "Fira Code"
style = "Regular"
[terminal]
shell = "zsh"
[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Super|Shift"
[selection]
save_to_clipboard = false
[window]
opacity = 0.8
[font]
size = 15
[window.class]
general = "Alacritty"
instance = "Alacritty"
[window.padding]
x = 1
y = 1
