# ============================================================================
# GRUVBOX MATERIAL MEDIUM DARK THEME
# ============================================================================

# Basic colors
background #000000
foreground #d4be98
selection_background #45403d
selection_foreground #d4be98

# Cursor
cursor #d4be98
cursor_text_color #282828

# URL underline color
url_color #a9b665

# Tab bar
active_tab_background #282828
active_tab_foreground #d4be98
inactive_tab_background #1d2021
inactive_tab_foreground #7c6f64

# Black
color0 #282828
color8 #928374

# Red
color1 #ea6962
color9 #ea6962

# Green
color2 #a9b665
color10 #a9b665

# Yellow
color3 #d8a657
color11 #d8a657

# Blue
color4 #7daea3
color12 #7daea3

# Magenta
color5 #d3869b
color13 #d3869b

# Cyan
color6 #89b482
color14 #89b482

# White
color7 #d4be98
color15 #d4be98

# ============================================================================
# Core Config
# ============================================================================

font_family      JetBrainsMono Nerd Font
font_size 13.0

window_padding_width 1
background_opacity 0.7

scrollback_lines 10000

shell zsh

copy_on_select off

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

repaint_delay 10
input_delay 3
sync_to_monitor yes

cursor_shape block
cursor_blink_interval 0
