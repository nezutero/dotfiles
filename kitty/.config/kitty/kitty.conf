# ── Fonts ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Regular
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        15.0

# ── Window ───────────────────────────────────────────────────────────────────
background_opacity 0.8
window_padding_width 1
remember_window_size yes

# ── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 1.0

# ── Shell ────────────────────────────────────────────────────────────────────
shell zsh

# ── Clipboard ────────────────────────────────────────────────────────────────
copy_on_select no

# Cursor
cursor_shape block

# ── Kanagawa Wave Colors ─────────────────────────────────────────────────────

# Primary
background #000000
foreground #c5c9c5

# Normal colors
color0  #090618
color1  #c34043
color2  #76946a
color3  #c0a36e
color4  #7e9cd8
color5  #957fb8
color6  #6a9589
color7  #c8c093

# Bright colors
color8  #727169
color9  #e82424
color10 #98bb6c
color11 #e6c384
color12 #7fb4ca
color13 #938aa9
color14 #7aa89f
color15 #dcd7ba

# Selection
selection_background #2d4f67
selection_foreground #c8c093

# Indexed colors (256-color palette extensions)
# index 16
color16 #ffa066
# index 17
color17 #ff5d62
