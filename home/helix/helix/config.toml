# Helix settings. Every option: https://docs.helix-editor.com/editor.html
# Changes apply after :config-reload (or restarting Helix). No rebuild needed.

theme = "tokyonight_transparent" # themes/tokyonight_transparent.toml

[editor]
# Line numbers and guides
line-number = "absolute" # current line still shows its real number / relative*
# rulers = [90]            # colorcolumn
text-width = 100         # used by :reflow
# Left side of the screen, in order. "spacer" is a 1-column gap:
# add or remove spacers to change the gap. Default:
# ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
gutters = ["diagnostics", "line-numbers", "diff"]

scrolloff = 8
true-color = true

[editor.soft-wrap]
enable = false       # wrap + linebreak + breakindent in one
#wrap-indicator = "" # no ↪ at the start of wrapped lines

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.lsp]
display-messages = true
auto-signature-help	= true
display-signature-help-docs	= true

[editor.file-picker]
hidden = false # show dotfiles in space f

[editor.statusline]
left = ["mode", "spinner", "spacer", "version-control"]
center = ["file-name", "diagnostics"]
right = ["selections", "position", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.indent-guides]
render = true
character = "┆" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[keys.normal]
# Move the current line down / up. To move several lines, select them
# with x first. Uses the yank register, like dd + p in Vim.
A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

# Helix has no quickfix list. Closest thing: next / previous
# diagnostic, centered on screen (cnext/cprev + zz)
C-k = ["goto_next_diag", "align_view_center"]
C-j = ["goto_prev_diag", "align_view_center"]

# Vim-style motion
"^" = "goto_line_start"
"0" = "goto_line_start"
"$" = "goto_line_end"

[keys.normal.space]
x = ":sh chmod +x %{buffer_name}"
