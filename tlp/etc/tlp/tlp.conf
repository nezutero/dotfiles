# === CPU GOVERNOR ===
# Options: ondemand, powersave, performance, conservative, schedutil
# ondemand = scales with load
CPU_SCALING_GOVERNOR_ON_AC=ondemand
CPU_SCALING_GOVERNOR_ON_BAT=ondemand

# === AUDIO POWER SAVING ===
# 0 = always off, 1 = enable power saving
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0

# === WIFI POWER SAVING ===
# off = disable power saving, on = enable power saving
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# === USB AUTOSUSPEND ===
# 0 = disable, 1 = enable
# OFF always (no USB devices anyway)
USB_AUTOSUSPEND=0

# === BATTERY CHARGE THRESHOLDS ===
# Optimal for longevity: 75-80%
# For occasional 100%: 0-100%
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
