[main]
shell = zsh
font = JetBrainsMono Nerd Font:size=9.5
dpi-aware = yes
pad = 1x1
selection-target = none

[bell]
urgent = no
notify = no
visual = no

[scrollback]
lines = 10000
multiplier = 3.0

[url]
launch = xdg-open ${url}
label-letters = sadfjklewcmpgh
osc8-underline = url-mode

[cursor]
style = block
blink = no
beam-thickness = 1.5
underline-thickness = 1.0

[mouse]
hide-when-typing = yes

[colors]
alpha=0.7
background = 000000
foreground = d4be98

regular0 = 3c3836  # black
regular1 = ea6962  # red
regular2 = a9b665  # green
regular3 = d8a657  # yellow
regular4 = 7daea3  # blue
regular5 = d3869b  # magenta
regular6 = 89b482  # cyan
regular7 = d4be98  # white

bright0 = 3c3836   # bright black
bright1 = ea6962   # bright red
bright2 = a9b665   # bright green
bright3 = d8a657   # bright yellow
bright4 = 7daea3   # bright blue
bright5 = d3869b   # bright magenta
bright6 = 89b482   # bright cyan
bright7 = d4be98   # bright white

selection-foreground = 282828
selection-background = d4be98

[key-bindings]
clipboard-copy = Control+Shift+c
clipboard-paste = Control+Shift+v

scrollback-up-page = Shift+Page_Up
scrollback-down-page = Shift+Page_Down
scrollback-up-half-page = Control+Shift+Page_Up
scrollback-down-half-page = Control+Shift+Page_Down
scrollback-up-line = Control+Shift+Up
scrollback-down-line = Control+Shift+Down

search-start = Control+Shift+r
